<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İyi ki Varsın</title>

  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Source Serif 4', serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #1b2a38, #0b141c);
      color: #e6e6e6;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .page.active {
      display: flex;
    }

    h1 {
      font-size: clamp(1.8rem, 5.5vw, 2.6rem);
      margin-bottom: 20px;
      font-weight: 600;
    }

    .divider {
      width: 70px;
      height: 2px;
      background: #6c8aa3;
      margin: 24px 0;
    }

    p {
      max-width: 720px;
      line-height: 1.8;
      font-size: clamp(1rem, 4.5vw, 1.1rem);
      color: #d0d8dd;
      white-space: pre-line;
    }

    button {
      margin-top: 36px;
      padding: 14px 36px;
      font-size: 0.95rem;
      background: transparent;
      color: #e6e6e6;
      border: 1px solid #6c8aa3;
      cursor: pointer;
    }

    button:hover {
      background: #6c8aa3;
      color: #0b141c;
    }

    /* SAYFA 2 */
    .image-wrapper {
      width: 100%;
      max-width: 900px;
    }

    .image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.6);
    }

    .download {
      margin-top: 20px;
      color: #9fb4c6;
      text-decoration: underline;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <!-- SAYFA 1 -->
  <div class="page active" id="page1">
    <h1>Bugün senin günündü</h1>
    <div class="divider"></div>
    <p>
Bugün senin günündü  
ve bunu seninle yaşamak güzeldi.

Uzağımda olduğunu sansan da  
aslında tüm gün aklımın içinde,  
çok yakınımdaydın.

Varlığın fark yaratıyor.  
İyi ki varsın…

P.S.  
Bir sonraki sayfada  
sana özel bir görsel var.
    </p>
    <button onclick="goNext()">İleri</button>
  </div>

  <!-- SAYFA 2 -->
  <div class="page" id="page2">
    <div class="image-wrapper">
      <img src="IMG_0444.png" alt="Senin için">
    </div>

    <a class="download" href="IMG_0444.png" download>
      Görseli indir
    </a>
  </div>

  <script>
    function goNext() {
      document.getElementById('page1').classList.remove('active');
      document.getElementById('page2').classList.add('active');
      window.scrollTo(0, 0);
    }
  </script>

</body>
</html>
